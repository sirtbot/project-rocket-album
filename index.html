<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Rocket · Comboio 17/9</title>
  <link rel="icon" href="/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="/"><img src="/logo.svg" alt="Project Rocket"></a>
    <nav class="filtros" id="filtros"></nav>
  </header>

  <section class="hero">
    <div class="etiqueta">Comboio · 17 set 2026</div>
    <h1 class="titulo"><span>Ninguém fica</span><span class="vermelho">para trás</span></h1>
    <p class="sub"><b id="total">0</b> momentos da estrada, escolhidos foto a foto. <b class="ambar">Carrega numa</b> para abrir.</p>
  </section>

  <main class="grelha" id="grelha"></main>

  <footer class="rodape">
    <div class="quadrado"></div>
    <span>NINGUÉM FICA PARA TRÁS</span>
    <span class="direita">trucksbook.eu · Project Rocket</span>
  </footer>

  <div class="caixa" id="caixa" aria-hidden="true">
    <button class="fechar" id="fechar" aria-label="Fechar">×</button>
    <button class="seta ant" id="ant" aria-label="Anterior">‹</button>
    <figure>
      <img id="caixa-img" src="" alt="">
      <figcaption><span id="caixa-legenda"></span><span class="contador" id="caixa-n"></span></figcaption>
    </figure>
    <button class="seta seg" id="seg" aria-label="Seguinte">›</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
