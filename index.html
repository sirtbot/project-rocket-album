<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚚 Project Rocket - Photo Album</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
      color: #fff;
      overflow-x: hidden;
    }

    .header {
      text-align: center;
      padding: 100px 40px;
      background: radial-gradient(circle at 50% 0%, rgba(225, 29, 46, 0.2) 0%, transparent 60%);
      border-bottom: 1px solid rgba(225, 29, 46, 0.1);
    }

    .header h1 {
      font-size: 4.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff 0%, #aaa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
      letter-spacing: -0.03em;
      opacity: 0;
    }

    .header p {
      font-size: 1.3rem;
      color: #999;
      font-weight: 300;
      letter-spacing: 0.05em;
      opacity: 0;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 40px;
      padding: 80px 60px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .photo-card {
      position: relative;
      aspect-ratio: 16/9;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      border: 1px solid rgba(225, 29, 46, 0.2);
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      transition: all 0.3s ease;
    }

    .photo-card:hover {
      transform: translateY(-10px) scale(1);
      border-color: rgba(225, 29, 46, 0.6);
      box-shadow: 0 20px 60px rgba(225, 29, 46, 0.2);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .photo-card:hover img {
      transform: scale(1.08);
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .photo-card:hover .photo-overlay {
      opacity: 1;
    }

    .photo-overlay h3 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }

    .photo-overlay p {
      font-size: 0.9rem;
      color: #aaa;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.98);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .modal.active { display: flex; }

    .modal-content {
      position: relative;
      max-width: 95vw;
      max-height: 95vh;
      animation: zoomIn 0.3s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-content img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 3rem;
      cursor: pointer;
      color: #fff;
      background: rgba(225, 29, 46, 0.8);
      border: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    .modal-close:hover {
      background: rgba(225, 29, 46, 1);
    }

    .counter {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #aaa;
    }

    @media (max-width: 768px) {
      .header h1 { font-size: 2.5rem; }
      .gallery { grid-template-columns: 1fr; padding: 40px 20px; gap: 20px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚚 PROJECT ROCKET</h1>
    <p>Momentos épicos das estradas — Album de viagens</p>
  </div>

  <div class="gallery" id="gallery"></div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <img id="modal-img" src="" alt="">
      <div class="counter"><span id="current">1</span> / <span id="total">1</span></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
  </div>

  <script type="module">
    import gsap from 'https://cdn.jsdelivr.net/npm/gsap@3.12.2/index.js';

    const photos = [
      { url: '/photos/ets2_1.jpg', title: 'Estrada ao Amanhecer', desc: 'Viagem matinal' },
      { url: '/photos/ets2_2.jpg', title: 'Noite de Convívio', desc: 'Rota épica' },
      { url: '/photos/ets2_3.jpg', title: 'Entrega Concluída', desc: 'Destino atingido' },
      { url: 'https://media.discordapp.net/attachments/996508827501473922/1550253800668008478/image.png?ex=6aada9dc&is=6aac585c&hm=ccbf70db803ce6613ecfdf76b3266ea55b00e31ccce7aa0bf840c901cc99b824&=&format=webp&quality=lossless', title: 'Convoy Épico', desc: 'Juntos nas estradas' },
      { url: 'https://media.discordapp.net/attachments/996508827501473922/1550253613555785758/image.png?ex=6aada9af&is=6aac582f&hm=04345f18d34868f5bddf4b3791162393462584cbe854fba232f7951c4f22fb8b&=&format=webp&quality=lossless', title: 'Viagem Noturna', desc: 'Paisagem nocturna' },
    ];

    const gallery = document.getElementById('gallery');
    
    photos.forEach((photo, i) => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.innerHTML = `
        <img src="${photo.url}" alt="${photo.title}" loading="lazy">
        <div class="photo-overlay">
          <h3>${photo.title}</h3>
          <p>${photo.desc}</p>
        </div>
      `;
      card.onclick = () => openModal(i);
      gallery.appendChild(card);
    });

    document.getElementById('total').textContent = photos.length;

    // Animações GSAP
    gsap.to('.header h1', { duration: 0.9, opacity: 1, y: 0, delay: 0.2 });
    gsap.to('.header p', { duration: 0.9, opacity: 1, y: 0, delay: 0.4 });
    gsap.to('.photo-card', { 
      duration: 0.8, 
      opacity: 1, 
      y: 0,
      scale: 1,
      stagger: 0.12,
      delay: 0.6,
      ease: 'power2.out'
    });

    window.openModal = (index) => {
      document.getElementById('modal-img').src = photos[index].url;
      document.getElementById('current').textContent = index + 1;
      document.getElementById('modal').classList.add('active');
    };

    window.closeModal = () => {
      document.getElementById('modal').classList.remove('active');
    };

    // Fechar modal com ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
